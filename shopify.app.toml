# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "PraesenteIntegration"
client_id = "ad45690e00ce9d06544626cb238c4af7"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# write_products reicht für Varianten, SKU und Produkt-Metafield-Definitionen.
# write_metafield_definitions existiert in der aktuellen API nicht.
scopes = "write_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
